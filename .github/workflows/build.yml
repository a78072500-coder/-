name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller edge-tts

      - name: Unit tests
        run: python -m pytest -q

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-small-v1

      - name: Make Japanese test audio (TTS)
        run: python scripts/smoke_test.py make-wav ja.wav

      - name: End-to-end check with real Whisper (source)
        run: python scripts/smoke_test.py check ja.wav -- python -m jp_subtitle

      - name: Build exe
        run: python scripts/build_exe.py

      - name: End-to-end check with real Whisper (exe)
        run: python scripts/smoke_test.py check ja.wav -- dist/jp_subtitle/jp_subtitle.exe

      - name: exe falls back to CPU when there is no GPU
        run: python scripts/smoke_test.py check ja.wav --device cuda -- dist/jp_subtitle/jp_subtitle.exe

      - name: Zip exe folder
        run: 7z a -tzip -mx=1 jp_subtitle-windows.zip .\dist\jp_subtitle | Out-Null

      - name: Upload full zip
        uses: actions/upload-artifact@v4
        with:
          name: jp_subtitle-windows
          path: jp_subtitle-windows.zip
          compression-level: 0
          retention-days: 30

      # 라이브러리가 그대로일 때는 exe 하나만 바꿔도 새 코드가 적용된다 (작은 업데이트용)
      - name: Upload exe only (update)
        uses: actions/upload-artifact@v4
        with:
          name: jp_subtitle-exe-only
          path: dist/jp_subtitle/jp_subtitle.exe
          retention-days: 30

  macos:
    runs-on: macos-14  # Apple Silicon
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller edge-tts

      - name: Unit tests
        run: python -m pytest -q

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-small-mac-v1

      - name: Make Japanese test audio (TTS)
        run: python scripts/smoke_test.py make-wav ja.wav

      - name: End-to-end check with real Whisper on Apple GPU (source)
        run: python scripts/smoke_test.py check ja.wav --device mlx -- python -m jp_subtitle

      - name: Build app
        run: python scripts/build_exe.py

      - name: End-to-end check with real Whisper on Apple GPU (app)
        run: python scripts/smoke_test.py check ja.wav --device mlx -- dist/jp_subtitle.app/Contents/MacOS/jp_subtitle

      - name: End-to-end check on CPU (app)
        run: python scripts/smoke_test.py check ja.wav -- dist/jp_subtitle.app/Contents/MacOS/jp_subtitle

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: jp_subtitle-mac
          path: dist/jp_subtitle-mac.zip
          compression-level: 0
          retention-days: 30

  # 기본 브랜치에 들어간 빌드만 "latest" 릴리스로 올린다.
  # 공개 저장소의 릴리스 파일은 로그인 없이 받을 수 있다:
  #   https://github.com/<owner>/<repo>/releases/latest/download/<파일 이름>
  release:
    needs: [windows, macos]
    # 맥 빌드가 실패해도 Windows 업데이트는 나가게 한다
    if: >-
      always() && needs.windows.result == 'success' && github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la artifacts
          gh release delete latest --yes --cleanup-tag || true
          notes="일본어 실시간 자막 + 한국어 번역 최신 빌드 (${GITHUB_SHA::7})

          Windows
          - 처음 설치: jp_subtitle-windows.zip 을 받아 압축을 풀고 jp_subtitle.exe 실행
          - 업데이트: jp_subtitle.exe 만 받아 기존 폴더의 파일을 덮어쓰기 (config.toml 유지)

          macOS (Apple Silicon 권장)
          - jp_subtitle-mac.zip 을 받아 압축을 풀고 jp_subtitle.app 실행 (사용법.txt 참고)"
          gh release create latest artifacts/* --target "$GITHUB_SHA" --title "최신 빌드" --notes "$notes"
