name: Windows build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write  # "latest" 릴리스를 올리기 위해
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller edge-tts

      - name: Unit tests
        run: python -m pytest -q

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-small-v1

      - name: Make Japanese test audio (TTS)
        run: python scripts/smoke_test.py make-wav ja.wav

      - name: End-to-end check with real Whisper (source)
        run: python scripts/smoke_test.py check ja.wav -- python -m jp_subtitle

      - name: Build exe
        run: python scripts/build_exe.py

      - name: End-to-end check with real Whisper (exe)
        run: python scripts/smoke_test.py check ja.wav -- dist/jp_subtitle/jp_subtitle.exe

      - name: exe falls back to CPU when there is no GPU
        run: python scripts/smoke_test.py check ja.wav --device cuda -- dist/jp_subtitle/jp_subtitle.exe

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: jp_subtitle-windows
          path: dist/jp_subtitle
          retention-days: 90

      # 라이브러리가 그대로일 때는 exe 하나만 바꿔도 새 코드가 적용된다 (작은 업데이트용)
      - name: Upload exe only (update)
        uses: actions/upload-artifact@v4
        with:
          name: jp_subtitle-exe-only
          path: dist/jp_subtitle/jp_subtitle.exe
          retention-days: 90

      # 공개 저장소의 릴리스 파일은 로그인 없이 받을 수 있다:
      #   https://github.com/<owner>/<repo>/releases/latest/download/jp_subtitle.exe
      - name: Publish "latest" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          7z a -tzip -mx=1 jp_subtitle-windows.zip .\dist\jp_subtitle | Out-Null
          $ErrorActionPreference = 'Continue'
          gh release delete latest --yes --cleanup-tag 2>$null
          $ErrorActionPreference = 'Stop'
          $notes = @"
          일본어 실시간 자막 + 한국어 번역 최신 빌드 ($($env:GITHUB_SHA.Substring(0,7)))

          - 처음 설치: jp_subtitle-windows.zip 을 받아 압축을 풀고 jp_subtitle.exe 실행
          - 업데이트: jp_subtitle.exe 만 받아 기존 폴더의 파일을 덮어쓰기 (config.toml 유지)
          "@
          gh release create latest dist/jp_subtitle/jp_subtitle.exe jp_subtitle-windows.zip `
            --target $env:GITHUB_SHA --title "최신 빌드" --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
